<mat-card class="recipe-card" [routerLink]="['/recipe', recipe.id]" [ngStyle]="{'border': isSaved ? '2px solid #ff4081' : '2px solid transparent'}">
  <img mat-card-image [src]="recipe.image" [alt]="recipe.name">
  <mat-card-header>
    <mat-card-title>{{ recipe.name }}</mat-card-title>
    <mat-card-subtitle>
      {{ recipe.category }} • 
      <span [ngClass]="{'long-prep': recipe.prepTime > 30, 'short-prep': recipe.prepTime <= 30}">
        {{ recipe.prepTime }} mins
      </span> • {{ recipe.servings }} servings
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ recipe.description }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button color="accent" [disabled]="isSaved" (click)="onSaveClick($event)">
      @if (isSaved) {
        Saved ✓
      } @else {
        Save to Favourites
      }
    </button>
  </mat-card-actions>
</mat-card>

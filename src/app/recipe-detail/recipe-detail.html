<div class="detail-container">
  <button mat-button class="back-btn" routerLink="/home">
    <mat-icon>arrow_back</mat-icon> Back to Home
  </button>

  @if (recipe; as r) {
    <mat-card class="recipe-card-detail">
      <img mat-card-image [src]="r.image" [alt]="r.name" class="detail-img">
      <mat-card-header>
        <mat-card-title>{{ r.name }}</mat-card-title>
        <mat-card-subtitle>{{ r.category }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="meta-info">
          <span><mat-icon>timer</mat-icon> Prep Time: {{ r.prepTime }} mins</span>
          <span><mat-icon>restaurant</mat-icon> Servings: {{ r.servings }}</span>
        </div>
        
        <h3>Description</h3>
        <p>{{ r.description }}</p>
        
        <h3>Ingredients</h3>
        <ul class="ingredients-list">
          @for (ingredient of r.ingredients; track ingredient) {
            <li>{{ ingredient }}</li>
          }
        </ul>
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="accent" [disabled]="isSaved" (click)="onSave()">
          @if (isSaved) {
            Saved ✓
          } @else {
            Save to Favourites
          }
        </button>
      </mat-card-actions>
    </mat-card>
  } @else {
    <p>Recipe not found.</p>
  }
</div>
